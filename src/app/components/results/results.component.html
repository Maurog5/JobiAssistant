<div class="card shadow-sm border-0" *ngIf="status() !== 'idle'">
  <div class="card-body p-4">
    <h2 class="h5 card-title mb-4 fw-semibold">{{ i18n.t('results.title') }}</h2>

    <!-- Tabs -->
    <ul class="nav nav-pills mb-3 gap-1">
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="activeTab === 'linkedin'"
          (click)="setTab('linkedin')">
          {{ i18n.t('results.linkedin') }}
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="activeTab === 'pitch'"
          (click)="setTab('pitch')">
          {{ i18n.t('results.pitch') }}
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="activeTab === 'cover'"
          (click)="setTab('cover')">
          {{ i18n.t('results.cover') }}
        </button>
      </li>
    </ul>

    <!-- Loading -->
    <div *ngIf="status() === 'loading'" class="d-flex align-items-center gap-2 py-3 text-secondary">
      <div class="spinner-border spinner-border-sm text-warning" role="status"></div>
      <span class="small">{{ currentStep() }}</span>
    </div>

    <!-- Output -->
    <div
      *ngIf="status() === 'done' || (status() === 'loading' && getText())"
      class="bg-light rounded p-3 mb-3"
      style="white-space: pre-wrap; font-size: 0.92rem; line-height: 1.75; min-height: 120px;">
      {{ getText() }}
    </div>

    <!-- Error -->
    <div *ngIf="status() === 'error'" class="alert alert-danger small py-2">
      {{ i18n.t('error.api') }}
    </div>

    <!-- Copy button -->
    <button
      *ngIf="getText()"
      class="btn btn-sm"
      [class.btn-outline-secondary]="copiedTab !== activeTab"
      [class.btn-success]="copiedTab === activeTab"
      (click)="copy()">
      {{ copiedTab === activeTab ? i18n.t('results.copied') : i18n.t('results.copy') }}
    </button>
    <span class="text-secondary d-flex align-items-center gap-2" style="font-size: 0.75rem; justify-content: center;">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" class="bi text-warning" aria-hidden="true" focusable="false"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>
      {{ i18n.t('results.disclaimer') }}
    </span>
  </div>
</div>
